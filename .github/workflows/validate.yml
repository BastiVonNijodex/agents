name: Repository validieren

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Python einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Repository-Struktur prüfen
        run: python3 scripts/validate_repository.py

      - name: Validator testen
        run: python3 -m unittest discover -s tests -v

      - name: Synthetische Harness-Evals ausführen
        run: python3 scripts/evaluate_harness.py --results evals/reference-results.json --profile general --profile coding --profile production
